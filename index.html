<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Li Xinang — CV</title>
  <style>
    :root { --bg: #eef0f3; --fg: #1d1f23; --muted: #5b6270; --btn: #1d1f23; --btn-fg: #fff; --page-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181c; --fg: #e8eaed; --muted: #9aa0a6; --btn: #e8eaed; --btn-fg: #16181c; --page-shadow: 0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { max-width: 880px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    a.btn { display: inline-block; padding: 8px 14px; border-radius: 8px; background: var(--btn); color: var(--btn-fg); text-decoration: none; font-weight: 600; font-size: 14px; }
    main { max-width: 880px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 16px; }
    main img { width: 100%; height: auto; display: block; background: #fff; border-radius: 4px; box-shadow: var(--page-shadow); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Li Xinang</h1>
      <p>Senior Software Engineer · Tokyo · <a href="mailto:lixinang1997@gmail.com" style="color:inherit">lixinang1997@gmail.com</a></p>
    </div>
    <a class="btn" href="Li-Xinang-CV.pdf" download>Download PDF</a>
  </header>
  <main>
    <a href="Li-Xinang-CV.pdf"><img src="page-1.png" alt="CV page 1 of 2"></a>
    <a href="Li-Xinang-CV.pdf"><img src="page-2.png" alt="CV page 2 of 2"></a>
  </main>
</body>
</html>
